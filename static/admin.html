<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Администрирование - Система управления потоковым вещанием</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Навигация -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-links">
                    <a href="/index.html" class="nav-link">🎵 Плеер</a>
                    <a href="/broadcaster.html" class="nav-link" id="broadcasterLink" style="display: none;">🎙️ Ведущий</a>
                    <a href="/admin.html" class="nav-link active">⚙️ Администрирование</a>
                </div>
                <div class="user-info">
                    <span id="userName"></span>
                    <button id="logoutBtn" class="btn-logout">Выйти</button>
                </div>
            </div>
        </nav>

        <h1 style="margin-bottom: 20px;">⚙️ Управление пользователями</h1>

        <!-- Панель фильтрации -->
        <div class="filters">
            <div class="filter-group">
                <label>🔍 Логин:</label>
                <input type="text" id="filterLogin" placeholder="Поиск по логину">
            </div>
            <div class="filter-group">
                <label>👤 ФИО:</label>
                <input type="text" id="filterFullname" placeholder="Поиск по ФИО">
            </div>
            <div class="filter-group">
                <label>🎭 Роль:</label>
                <select id="filterRole">
                    <option value="">Все</option>
                    <option value="admin">Администратор</option>
                    <option value="broadcaster">Ведущий</option>
                    <option value="user">Пользователь</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📅 Дата регистрации (после):</label>
                <input type="date" id="filterDate">
            </div>
            <button id="applyFilters" class="btn-primary" style="width: auto; padding: 8px 20px;">Применить</button>
            <button id="resetFilters" class="btn-secondary" style="width: auto; padding: 8px 20px;">Сбросить</button>
        </div>

        <!-- Таблица пользователей -->
        <div class="card">
            <h3>📋 Список пользователей</h3>
            <div style="overflow-x: auto;">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Логин</th>
                            <th>ФИО</th>
                            <th>Роли</th>
                            <th>Дата регистрации</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="6" class="loading">Загрузка пользователей...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Модальные окна -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>✏️ Редактирование пользователя</h2>
            <form id="editUserForm">
                <div class="form-group">
                    <label>Логин (только латинские буквы):</label>
                    <input type="text" id="editLogin" required pattern="[A-Za-z]+">
                </div>
                <div class="form-group">
                    <label>ФИО (только русские буквы):</label>
                    <input type="text" id="editFullname" required>
                </div>
                <button type="submit" class="btn-primary">Сохранить</button>
            </form>
        </div>
    </div>

    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>🔑 Смена пароля</h2>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label>Новый пароль:</label>
                    <input type="password" id="newPassword" required>
                </div>
                <div class="form-group">
                    <label>Подтверждение пароля:</label>
                    <input type="password" id="confirmNewPassword" required>
                </div>
                <button type="submit" class="btn-primary">Сменить пароль</button>
            </form>
        </div>
    </div>

    <div id="rolesModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>👥 Назначение ролей</h2>
            <form id="assignRolesForm">
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" value="user"> 👤 Пользователь
                    </label>
                    <label>
                        <input type="checkbox" value="broadcaster"> 🎙️ Ведущий
                    </label>
                    <label>
                        <input type="checkbox" value="admin"> ⚙️ Администратор
                    </label>
                </div>
                <button type="submit" class="btn-primary">Сохранить</button>
            </form>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
