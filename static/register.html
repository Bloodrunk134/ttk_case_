<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Система управления потоковым вещанием</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <h1>Регистрация</h1>
        <form id="registerForm">
            <div class="form-group">
                <label for="login">Логин (только латинские буквы):</label>
                <input type="text" id="login" name="login" required autocomplete="username">
                <small>Пример: john123</small>
            </div>
            <div class="form-group">
                <label for="fullname">ФИО (только русские буквы):</label>
                <input type="text" id="fullname" name="fullname" required autocomplete="name">
                <small>Пример: Иван Петров</small>
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required autocomplete="new-password">
                <small>Латинские буквы, цифры, символы (мин. 4 символа)</small>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Подтверждение пароля:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-primary">Зарегистрироваться</button>
            <div class="register-link">
                Уже есть аккаунт? <a href="/login.html">Войти</a>
            </div>
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
        </form>
    </div>
    
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
